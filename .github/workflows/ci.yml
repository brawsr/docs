name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
      NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - id: examples-lock
        run: node -p "'commit=' + require('./examples.lock.json').commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: brawsr/examples
          ref: ${{ steps.examples-lock.outputs.commit }}
          path: .upstream/examples
      - run: npm run examples:source-check -- --source .upstream/examples
      - uses: actions/upload-artifact@v7
        with:
          name: static-docs
          path: out
          if-no-files-found: error
          retention-days: 7
